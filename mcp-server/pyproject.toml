[project]
name = "tams-mcp-server"
version = "0.1.0"
description = "MCP server for emaratech TAMS attendance API"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "msal>=1.28.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
]

[project.scripts]
tams-mcp = "tams_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
