[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mirastack-redfish-mcp"
version = "0.1.2"
description = "Schema-aware MCP server for Redfish-enabled infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mirastack Labs" }
]
keywords = ["mcp", "redfish", "bmc", "idrac", "ilo", "xcc", "openbmc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "mcp>=2.0.0",
  "httpx2>=2.5.0",
  "pydantic>=2.10.0",
  "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://mirastacklabs.ai"
Repository = "https://github.com/mirastacklabs-ai/mirastack-redfish-mcp"
Issues = "https://github.com/mirastacklabs-ai/mirastack-redfish-mcp/issues"
Documentation = "https://github.com/mirastacklabs-ai/mirastack-redfish-mcp#readme"

[project.scripts]
mirastack-redfish-mcp = "mirastack_redfish_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mirastack_redfish_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "tools/",
  "README.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "server.json",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.4",
  "mypy>=1.11.2",
  "types-PyYAML>=6.0.12.20250822",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["mirastack_redfish_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: marks tests requiring live Redfish services or external tools",
  "slow: marks larger corpus and mockup traversal tests",
]

