apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: maven-build-pipeline-run-
spec:
  pipelineRef:
    name: maven-build-pipeline
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: pipeline-pvc
  params:
    - name: maven_repo
      value: "http://REPLACE_WITH_NEXUS_MAVEN_URL/repository/maven-public/"
    - name: image_name
      value: "image-registry.openshift-image-registry.svc:5000/REPLACE_NAMESPACE/catalog-app"
    - name: git_url
      value: "https://github.com/REPLACE_WITH_YOUR_FORK/ex288-practice.git"
    - name: git_revision
      value: "main"
