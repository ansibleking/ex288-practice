services:
  mcp:
    build: .
    image: tams-attendance:latest
    env_file:
      - .env
    stdin_open: true
    tty: false
    entrypoint: ["tams-mcp"]
    # Use host network if TAMS is only reachable via corporate VPN on the host:
    # network_mode: host

  agent:
    build: .
    image: tams-attendance:latest
    env_file:
      - .env
    entrypoint: ["tams-agent"]
    profiles:
      - agent
    # Required for VPN/corporate LLM + TAMS URLs (dnrd.gov.ae, emaratech.ae):
    network_mode: host
