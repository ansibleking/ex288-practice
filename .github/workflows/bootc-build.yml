  build-disk-image:
    name: Build Disk Images (QCOW2 + VMDK)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to ghcr.io (podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          sudo podman login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-utils

      - name: Load XFS kernel module
        run: sudo modprobe xfs || true

      - name: Create output directory
        run: mkdir -p output

      - name: Pull bootc image
        run: |
          sudo podman pull \
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Build QCOW2 + VMDK disk images
        run: |
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v $(pwd)/output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --type vmdk \
            --rootfs xfs \
            --local \
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: List output files
        run: find output/ -type f | sort

      - name: Upload QCOW2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-bootc-mayil-qcow2
          path: output/qcow2/disk.qcow2
          retention-days: 7

      - name: Upload VMDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-bootc-mayil-vmdk
          path: output/vmdk/disk.vmdk
          retention-days: 7
