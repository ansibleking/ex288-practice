# Base defaults - overridden by devel.yaml / production.yaml
replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/helm-devel/myapp
  tag: latest

label:
  stage: devel

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 250m
    memory: 512Mi

service:
  port: 8080

route:
  tls:
    enabled: false
