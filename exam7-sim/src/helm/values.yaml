appName: catalog-app

image:
  repository: image-registry.openshift-image-registry.svc:5000/helm-devel/catalog-app
  tag: latest

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

labels:
  stage: devel

service:
  port: 8080

route:
  tls:
    enabled: false
